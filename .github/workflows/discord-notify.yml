name: Discord Notify

on:
  push:
    branches: [main, develop]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Send Discord Notification
        uses: IlshatS/discord-action@v1.2.0
        with:
          args: "**New commit on `${{ github.ref_name }}` by ${{ github.actor }}**\n> ${{ github.event.head_commit.message }}\n\n${{ github.event.head_commit.url }}"
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
