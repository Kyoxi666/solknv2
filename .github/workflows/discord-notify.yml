name: Discord Notify

on:
  push:
    branches: [main, develop]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: Ilshidur/action-discord@0.3.2
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          args: "📦 New commit on `{{ github.ref_name }}` by **${{ github.actor }}** — [View commit]({{ github.event.head_commit.url }})"
